<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Pokémon Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #2a2a3e; color: #fff; min-height: 100vh; }
        .container { display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: #1a1a2e; border-right: 3px solid #e94560; padding: 12px; overflow-y: auto; max-height: 100vh; position: sticky; top: 0; }
        .sidebar h2 { text-align: center; color: #e94560; margin-bottom: 10px; font-size: 1.1em; }
        .sidebar input[type="text"] { width: 100%; padding: 7px; border: 2px solid #333; border-radius: 4px; background: #111; color: #fff; margin-bottom: 8px; font-size: 0.85em; }
        .sidebar ul { list-style: none; max-height: 75vh; overflow-y: auto; }
        .sidebar li { padding: 5px 8px; cursor: pointer; border-radius: 3px; font-size: 0.82em; transition: background 0.2s; }
        .sidebar li:hover { background: #333; }
        .sidebar li.active { background: #e94560; color: #fff; }
        .main { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #f5f0e8; color: #222; border: 4px solid #666; border-radius: 8px; padding: 20px; width: 100%; max-width: 560px; }
        .top-section { display: flex; gap: 15px; margin-bottom: 15px; }

        .types-row { display: flex; gap: 8px; margin-bottom: 12px; }

        .hp-section { margin-bottom: 12px; }

        .hp-label, .hp-value { font-size: 0.9em; font-weight: bold; color: #555; }
        .hp-bar-container { width: 100%; height: 18px; background: #ccc; border: 2px solid #888; border-radius: 3px; overflow: hidden; }
        .hp-bar { height: 100%; width: 100%; background: #4caf50; transition: width 0.3s, background 0.3s; }
        .hp-bar.yellow { background: #ffc107; }
        .hp-bar.red { background: #f44336; }
        .hp-slider { width: 100%; margin-top: 5px; accent-color: #e94560; }
        .status-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .status-row label { font-size: 0.85em; font-weight: bold; color: #555; }
        .status-row select { padding: 4px 8px; border: 2px solid #999; border-radius: 4px; background: #fff; font-size: 0.85em; }
        .status-code { font-size: 1.1em; font-weight: bold; color: #e94560; min-width: 35px; }
        .status-indicator { font-size: 1.4em; }
        .ability-section { margin-bottom: 12px; padding: 8px; background: #eee; border-radius: 4px; border: 1px solid #ccc; }
        .ability-section label { font-size: 0.85em; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }
        .ability-search { width: 100%; padding: 5px; margin-bottom: 5px; border: 1px solid #999; border-radius: 4px; font-size: 0.85em; }
        .ability-section select { width: 100%; padding: 5px; border: 2px solid #999; border-radius: 4px; background: #fff; font-size: 0.85em; }
        .stats-section { margin-bottom: 12px; padding: 10px; background: #eee; border-radius: 4px; border: 1px solid #ccc; }
        .stats-section h3 { font-size: 0.9em; color: #e94560; margin-bottom: 8px; }
        .stat-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 3px; transition: background 0.2s; }
        .stat-row:hover { background: #ddd; }
        .stat-row.marked { background: #ffe0e6; }
        .stat-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #e94560; cursor: pointer; }
        .stat-row .stat-name { width: 45px; font-size: 0.85em; font-weight: bold; color: #333; }
        .stat-row .stat-bar-bg { flex: 1; height: 6px; background: #ccc; border-radius: 3px; overflow: hidden; }
        .stat-row .stat-bar-fill { height: 100%; background: #e94560; border-radius: 3px; transition: width 0.4s; }
        .moves-section { padding: 10px; background: #eee; border-radius: 4px; border: 1px solid #ccc; }
        .moves-section h3 { font-size: 0.9em; color: #e94560; margin-bottom: 8px; }
        .move-search { width: 100%; padding: 5px; margin-bottom: 8px; border: 1px solid #999; border-radius: 4px; font-size: 0.85em; }
        .moves-header { display: grid; grid-template-columns: 1fr 45px 45px 45px 45px; gap: 4px; font-size: 0.75em; font-weight: bold; color: #888; padding: 0 6px 4px; border-bottom: 1px solid #ccc; margin-bottom: 4px; }

<script src="listpok.js"></script>
<script>
let allAbilities = [];
let allMoves = [];
let currentMaxHP = 100;

const statusCodes = { normal:'', paralyzed:'PRZ', frozen:'FRZ', burn:'BRN', sleep:'SLZ', poison:'PSN', toxic:'PSL' };

// ===== CARREGAR POKÉMON DA LISTA LOCAL =====
// ===== CARREGAR POKÉMON (local + API) =====
async function loadPokemonList() {
    const listEl = document.getElementById('pokemon-list');
    const selectEl = document.getElementById('pokemon-select');

    // 1. Adiciona os locais (Gen 1 - sempre funciona)
    POKEMON.forEach(p => {
        const li = document.createElement('li');
        li.textContent = `#${p.id} ${cap(p.n)}`;
        li.dataset.id = p.id;
        li.addEventListener('click', () => selectPokemon(p.id));
        listEl.appendChild(li);

        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `#${p.id} ${cap(p.n)}`;
        selectEl.appendChild(opt);
    });

    // 2. Tenta carregar os demais pela API (Gen 2 a 9)
    try {
        const res = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025');
        const data = await res.json();
        const localIds = new Set(POKEMON.map(p => p.id));

        data.results.forEach((poke, i) => {
            const id = i + 1;
            if (localIds.has(id)) return; // já tem local

            const li = document.createElement('li');
            li.textContent = `#${id} ${cap(poke.name)}`;
            li.dataset.id = id;
            li.addEventListener('click', () => selectPokemonAPI(id));
            listEl.appendChild(li);

            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = `#${id} ${cap(poke.name)}`;
            selectEl.appendChild(opt);
        });
    } catch(e) {
        // Offline - só os 151 locais
        console.log('Offline: apenas Gen 1 disponível');
    }
}

// ===== SELECIONAR POKÉMON DA API (Gen 2+) =====
async function selectPokemonAPI(id) {
    try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
        const data = await res.json();

        const sprite = data.sprites.versions['generation-v']['black-white'].animated.front_default
            || data.sprites.front_default;
        const img = document.getElementById('sprite');
        img.src = sprite;

        document.getElementById('pokemon-name').value = cap(data.name);

        const typesEl = document.getElementById('types');
        typesEl.innerHTML = '';
        data.types.forEach(t => {
            const badge = document.createElement('span');
            badge.className = `type-badge type-${t.type.name}`;
            badge.textContent = t.type.name;
            typesEl.appendChild(badge);
        });

        const maxHP = data.stats.find(s => s.stat.name === 'hp').base_stat;
        currentMaxHP = maxHP;
        const slider = document.getElementById('hp-slider');
        slider.max = maxHP;
        slider.value = maxHP;
        updateHP(maxHP, maxHP);

        const statMap = { 'attack':'atk','defense':'def','special-attack':'spa','special-defense':'spd','speed':'spe' };
        data.stats.forEach(s => {
            const key = statMap[s.stat.name];
            if (key) {
                document.getElementById(`bar-${key}`).style.width = Math.min((s.base_stat / 200) * 100, 100) + '%';
            }
        });

        document.querySelectorAll('.stat-row input[type="checkbox"]').forEach(cb => {
            cb.checked = false;
            cb.closest('.stat-row').classList.remove('marked');
        });

        document.querySelectorAll('.sidebar li').forEach(li => {
            li.classList.toggle('active', li.dataset.id == id);
        });
        document.getElementById('pokemon-select').value = id;
        updateStatusIndicator();
    } catch(e) {
        alert('Não foi possível carregar (offline). Use um Pokémon da Gen 1.');
    }
}   
// ===== CARREGAR HABILIDADES (API) =====
async function loadAllAbilities() {
    try {
        const res = await fetch('https://pokeapi.co/api/v2/ability?limit=232');
        const data = await res.json();
        allAbilities = data.results;
        const sel = document.getElementById('ability-select');
        allAbilities.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a.name;
            opt.textContent = cap(a.name);
            sel.appendChild(opt);
        });
    } catch(e) {
        document.getElementById('ability-select').innerHTML = '<option value="">(offline)</option>';
    }
}

// ===== CARREGAR MOVES (API) =====
async function loadAllMoves() {
    try {
        const res = await fetch('https://pokeapi.co/api/v2/move?limit=935');
        const data = await res.json();
        allMoves = data.results;
        ['move1','move2','move3','move4'].forEach((id, idx) => {
            const sel = document.getElementById(id);
            sel.innerHTML = '<option value="">--</option>';
            allMoves.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.name;
                opt.textContent = cap(m.name);
                sel.appendChild(opt);
            });
            sel.onchange = async (e) => {
                const name = e.target.value;
                if (name) {
                    try {
                        const r = await fetch(`https://pokeapi.co/api/v2/move/${name}`);
                        const d = await r.json();
                        document.getElementById(`pp${idx+1}`).textContent = d.pp || '--';
                        document.getElementById(`pow${idx+1}`).textContent = d.power || '—';
                        document.getElementById(`acc${idx+1}`).textContent = d.accuracy !== null ? d.accuracy : '—';
                        // Preencher PP atual com o max
                        document.getElementById(`ppcur${idx+1}`).value = d.pp || '';
                    } catch(err) {
                        document.getElementById(`pp${idx+1}`).textContent = '--';
                        document.getElementById(`pow${idx+1}`).textContent = '--';
                        document.getElementById(`acc${idx+1}`).textContent = '--';
                    }
                } else {
                    document.getElementById(`pp${idx+1}`).textContent = '--';
                    document.getElementById(`pow${idx+1}`).textContent = '--';
                    document.getElementById(`acc${idx+1}`).textContent = '--';
                    document.getElementById(`ppcur${idx+1}`).value = '';
                }
                checkPPStatus();
            };
        });
    } catch(e) {
        // offline - usa moves locais do pokemon
        ['move1','move2','move3','move4'].forEach((id, idx) => {
            const sel = document.getElementById(id);
            sel.innerHTML = '<option value="">-- (offline)</option>';
        });
    }
}

// ===== SELECIONAR POKÉMON =====
function selectPokemon(id) {
    const p = POKEMON.find(x => x.id === id);
    if (!p) return;

    const spriteUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${id}.gif`;
    const fallbackUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
    const img = document.getElementById('sprite');
    img.src = spriteUrl;
    img.onerror = () => { img.src = fallbackUrl; img.onerror = null; };

    document.getElementById('pokemon-name').value = cap(p.n);

    const typesEl = document.getElementById('types');
    typesEl.innerHTML = '';
    p.t.forEach(t => {
        const badge = document.createElement('span');
        badge.className = `type-badge type-${t}`;
        badge.textContent = t;
        typesEl.appendChild(badge);
    });

    currentMaxHP = p.s[0];
    const slider = document.getElementById('hp-slider');
    slider.max = currentMaxHP;
    slider.value = currentMaxHP;
    updateHP(currentMaxHP, currentMaxHP);

    const statMap = ['atk','def','spa','spd','spe'];
    p.s.slice(1).forEach((val, i) => {
        document.getElementById(`bar-${statMap[i]}`).style.width = Math.min((val / 200) * 100, 100) + '%';
    });

    document.querySelectorAll('.stat-row input[type="checkbox"]').forEach(cb => {
        cb.checked = false;
        cb.closest('.stat-row').classList.remove('marked');
    });

    document.querySelectorAll('.sidebar li').forEach(li => {
        li.classList.toggle('active', li.dataset.id == id);
    });
    document.getElementById('pokemon-select').value = id;
    updateStatusIndicator();
}

// ===== HP =====
function updateHP(cur, max) {
    const pct = (cur / max) * 100;
    const bar = document.getElementById('hp-bar');
    bar.style.width = pct + '%';
    bar.className = 'hp-bar';
    if (pct <= 20) bar.classList.add('red');
    else if (pct <= 50) bar.classList.add('yellow');
    document.getElementById('hp-text').textContent = `${cur} / ${max}`;
    updateStatusIndicator();
}

// ===== STATUS INDICATOR (positivo/negativo) =====
function updateStatusIndicator() {
    const hpSlider = document.getElementById('hp-slider');
    const hpPct = (parseInt(hpSlider.value) / parseInt(hpSlider.max)) * 100;
    const status = document.getElementById('status-select').value;
    const indicator = document.getElementById('status-indicator');

    // Verificar PP baixo
    let ppLow = false;
    ['ppcur1','ppcur2','ppcur3','ppcur4'].forEach((id, idx) => {
        const cur = document.getElementById(id).value;
        const max = parseInt(document.getElementById(`pp${idx+1}`).textContent) || 0;
        if (cur !== '' && max > 0 && (parseInt(cur) / max) <= 0.25) ppLow = true;
    });

    let isCritical = false;
    let isBad = false;

    if (hpPct <= 20) isCritical = true;
    if (status === 'poison' || status === 'toxic') isBad = true;
    if (status === 'frozen' || status === 'sleep') isBad = true;
    if (status === 'burn') isBad = true;
    if (status === 'paralyzed') isBad = true;
    if (ppLow) isBad = true;

    if (isCritical) {
        indicator.textContent = '🔴';
        indicator.title = 'Estado crítico!';
    } else if (isBad) {
        indicator.textContent = '🟡';
        indicator.title = 'Estado desfavorável';
    } else {
        indicator.textContent = '🟢';
        indicator.title = 'Estado bom';
    }
}

// ===== CHECK PP STATUS =====
function checkPPStatus() {
    ['ppcur1','ppcur2','ppcur3','ppcur4'].forEach((id, idx) => {
        const el = document.getElementById(id);
        const max = parseInt(document.getElementById(`pp${idx+1}`).textContent) || 0;
        const cur = parseInt(el.value);
        if (max > 0 && cur !== NaN && (cur / max) <= 0.25) {
            el.classList.add('pp-low');
        } else {
            el.classList.remove('pp-low');
        }
    });
    updateStatusIndicator();
}

// Level - recalcula HP máximo
document.getElementById('level-input').addEventListener('change', function() {
    const lvl = Math.max(1, Math.min(100, parseInt(this.value) || 1));
    this.value = lvl;
    if (currentMaxHP > 0) {
        const newMax = Math.max(1, Math.floor((2 * currentMaxHP * lvl / 100) + lvl + 10));
        const slider = document.getElementById('hp-slider');
        slider.max = newMax;
        slider.value = newMax;
        updateHP(newMax, newMax);
    }
});

function cap(s) {
    return s.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function applyTheme(mode){
const card=document.querySelector('.card');
const sidebar=document.querySelector('.sidebar');
if(mode==='dark'){
document.body.style.background='#1e1e2e';

function applyBg(input){

}

// anotações 
// ===== ANOTAÇÕES =====
function getNotes(){
return JSON.parse(localStorage.getItem('pokemon-notes')||'[]');
}

function setNotes(notes){
localStorage.setItem('pokemon-notes',JSON.stringify(notes));
renderNotesList();
}

function toggleNotesScreen(){
const s=document.getElementById('notes-screen');
s.style.display=s.style.display==='block'?'none':'block';
renderNotesList();
}

function saveNote(){
const pokemon=document.getElementById('note-pokemon').value.trim();
const meta=document.getElementById('note-meta').value.trim();
const obs=document.getElementById('note-obs').value.trim();
if(!pokemon&&!meta&&!obs){alert('Escreva algo antes de salvar!');return}
const notes=getNotes();
notes.unshift({id:Date.now(),pokemon,meta,obs,date:new Date().toLocaleDateString('pt-BR')});
setNotes(notes);
alert('✅ Anotação salva!');
}

function deleteNote(id){
if(!confirm('Deletar esta anotação?'))return;
const notes=getNotes().filter(n=>n.id!==id);
setNotes(notes);
}

function deleteAllNotes(){
if(!confirm('Deletar TODAS as anotações?'))return;
localStorage.removeItem('pokemon-notes');
renderNotesList();
}

function loadNote(id){
const notes=getNotes();
const n=notes.find(x=>x.id===id);
if(!n)return;
document.getElementById('note-pokemon').value=n.pokemon;
document.getElementById('note-meta').value=n.meta;
document.getElementById('note-obs').value=n.obs;
}

function exportNote(){
const pokemon=document.getElementById('note-pokemon').value.trim();
const meta=document.getElementById('note-meta').value.trim();
const obs=document.getElementById('note-obs').value.trim();
if(!pokemon&&!meta&&!obs){alert('Escreva algo antes de exportar!');return}
const data=JSON.stringify({pokemon,meta,obs,date:new Date().toLocaleDateString('pt-BR')},null,2);
const blob=new Blob([data],{type:'application/json'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download=`anotacao_${pokemon||'pokemon'}.json`;
a.click();
}

function exportAllNotes(){
const notes=getNotes();
if(notes.length===0){alert('Nenhuma anotação para exportar!');return}
const blob=new Blob([JSON.stringify(notes,null,2)],{type:'application/json'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='todas_anotacoes.json';
a.click();
}

function importNote(input){
if(!input.files||!input.files[0])return;
const reader=new FileReader();
reader.onload=function(e){
try{
const data=JSON.parse(e.target.result);
if(Array.isArray(data)){
const notes=getNotes();
data.forEach(d=>{if(!notes.find(n=>n.id===d.id))notes.unshift(d)});
setNotes(notes);
alert(`✅ ${data.length} anotação(ões) importada(s)!`);
}else{
const notes=getNotes();
if(!notes.find(n=>n.pokemon===data.pokemon&&n.meta===data.meta)){
notes.unshift({id:Date.now(),pokemon:data.pokemon,meta:data.meta,obs:data.obs,date:data.date});
setNotes(notes);
}
alert('✅ Anotação importada!');
}
}catch(err){alert('❌ Arquivo inválido!')}
input.value='';
};
reader.readAsText(input.files[0]);
}

function renderNotesList(){
const el=document.getElementById('notes-list');
const notes=getNotes();
if(notes.length===0){el.innerHTML='<div style="color:#999;font-size:0.8em;padding:8px;">Nenhuma anotação salva.</div>';return}
el.innerHTML=notes.map(n=>`
<div style="padding:8px;border-bottom:1px solid #ccc;display:flex;justify-content:space-between;align-items:center;">
<div style="flex:1;cursor:pointer;" onclick="loadNote(${n.id})">
<div style="font-weight:bold;font-size:0.85em;">${n.pokemon||'Sem nome'} ${n.meta?'| '+n.meta:''}</div>
<div style="font-size:0.7em;color:#888;">${n.date||''}</div>
</div>
<button onclick="deleteNote(${n.id})" style="width:25px;height:25px;border:1px solid #f44336;border-radius:3px;background:#f44336;color:#fff;cursor:pointer;font-size:0.7em;">✕</button>
</div>
`).join('');
}

// Autosave
setInterval(function(){
if(localStorage.getItem('autosave')==='true'){
const pokemon=document.getElementById('note-pokemon').value.trim();
const meta=document.getElementById('note-meta').value.trim();
const obs=document.getElementById('note-obs').value.trim();
if(pokemon||meta||obs){
const notes=getNotes();
const existing=notes.find(n=>n.pokemon===pokemon&&n.meta===meta);
if(existing){existing.obs=obs;existing.date=new Date().toLocaleDateString('pt-BR')}
else{notes.unshift({id:Date.now(),pokemon,meta,obs,date:new Date().toLocaleDateString('pt-BR')})}
setNotes(notes);
}
}
},5000);
